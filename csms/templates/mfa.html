{% extends "base.html" %}{% block content %}
<div class="card login"><h1>Dvofaktorska provjera</h1><p class="muted">Upiši 6-znamenkasti kod iz aplikacije za autentifikaciju.</p>
<form method="post" action="/login/mfa"><input type="hidden" name="csrf" value="{{ csrf }}">
<input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" placeholder="123456" required autofocus autocomplete="one-time-code">
<button>Potvrdi</button></form></div>
{% endblock %}
